

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smart_attendance_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Password123"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  backend:
    build:
      context: ./backend
    container_name: smart_attendance_api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=SmartAttendanceDb;User Id=sa;Password=YourStrong!Password123;TrustServerCertificate=True;
      - JwtSettings__Secret=YOUR_SUPER_SECRET_KEY_FOR_JWT_THAT_IS_LONG_ENOUGH
      - Cors__AllowedOrigins__0=http://localhost:3000
      - EnableAutoMigration=true
      - Cors__AllowedOrigins__1=http://localhost:5173
      
  frontend:
    build:
      context: ./frontend
    container_name: smart_attendance_ui
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  sql_data:
